<title>Leasify Commercial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: app shell. Left rail of seven modules, working area on the right. Phone: rail becomes a scrolling tab strip. */
:root {
  --bg: #f8fafd; --surface: #ffffff; --surface-2: #eff2f6; --surface-3: #e6eaf0; --border: #cdd1d6; --hair: #e1e5ea;
  --fg: #192029; --fg-2: #323841; --muted: #585e67;
  --brand: #0063d8; --brand-ink: #0057c5; --glow: #deedff; --on-brand: #ffffff;
  --ink: #161b22; --ink-2: #20242c; --on-ink: #eff2f6; --on-ink-muted: #b6bfcb;
  --good: #006622; --good-bg: #e2f4e7; --warn: #7e4b00; --warn-bg: #fbf0d9; --bad: #a90017; --bad-bg: #fbe4e5;
  --s1: #0063d8; --s2: #424852; --s3: #808790; --s4: #9cc6f7;
  --grid: #e5e8ec; --axis: #c7cbd0;
  --wa-bg: #ece5dd; --wa-in: #ffffff; --wa-out: #d9fdd3; --wa-head: #0b6157; --wa-fg: #111b21; --wa-meta: #667781;
  --shadow: 0 1px 2px rgba(25,32,41,.06), 0 4px 16px rgba(25,32,41,.05);
  --f-head: "Space Grotesk", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 10px; --r-s: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1218; --surface: #141920; --surface-2: #1a2029; --surface-3: #222933; --border: #2f353d; --hair: #262c34;
  --fg: #e8ebef; --fg-2: #c3c8ce; --muted: #8d939a;
  --brand: #5ca6ff; --brand-ink: #7db7ff; --glow: #13243c; --on-brand: #06121f;
  --good: #61cb7c; --good-bg: #12301b; --warn: #e3ad4b; --warn-bg: #33270f; --bad: #ff7e76; --bad-bg: #3a1518;
  --s1: #5ca6ff; --s2: #999fa6; --s3: #646970; --s4: #2a5a92;
  --grid: #2a2e35; --axis: #43484f;
  --wa-bg: #0b141a; --wa-in: #202c33; --wa-out: #005c4b; --wa-head: #1f2c34; --wa-fg: #e9edef; --wa-meta: #8696a0;
  --shadow: none; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0e1218; --surface: #141920; --surface-2: #1a2029; --surface-3: #222933; --border: #2f353d; --hair: #262c34;
  --fg: #e8ebef; --fg-2: #c3c8ce; --muted: #8d939a;
  --brand: #5ca6ff; --brand-ink: #7db7ff; --glow: #13243c; --on-brand: #06121f;
  --good: #61cb7c; --good-bg: #12301b; --warn: #e3ad4b; --warn-bg: #33270f; --bad: #ff7e76; --bad-bg: #3a1518;
  --s1: #5ca6ff; --s2: #999fa6; --s3: #646970; --s4: #2a5a92;
  --grid: #2a2e35; --axis: #43484f;
  --wa-bg: #0b141a; --wa-in: #202c33; --wa-out: #005c4b; --wa-head: #1f2c34; --wa-fg: #e9edef; --wa-meta: #8696a0;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--f-head); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.num { font-size: .92em; }
.muted { color: var(--muted); }
.small { font-size: 12px; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
.rail { background: var(--ink); color: var(--on-ink); display: flex; flex-direction: column; gap: 4px; padding: 18px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: #0063d8; display: grid; place-items: center; font-family: var(--f-head); font-weight: 700; color: #fff; font-size: 15px; }
.brand-name { font-family: var(--f-head); font-weight: 700; font-size: 15px; line-height: 1.15; }
.brand-name span { display: block; font-family: var(--f-body); font-weight: 500; font-size: 11px; color: var(--on-ink-muted); letter-spacing: .02em; }
.nav-group { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--on-ink-muted); padding: 14px 10px 4px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; color: var(--on-ink); text-decoration: none; font-weight: 500; font-size: 13.5px; }
.nav a:hover { background: var(--ink-2); }
.nav a[aria-current="page"] { background: #0063d8; color: #fff; }
.nav a .k { margin-left: auto; font-family: var(--f-mono); font-size: 11px; color: var(--on-ink-muted); }
.nav a[aria-current="page"] .k { color: #dbe9ff; }
.nav svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.rail-foot { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid var(--ink-2); font-size: 11.5px; color: var(--on-ink-muted); display: grid; gap: 8px; }
.rail-foot button { background: var(--ink-2); border: 1px solid #343a44; color: var(--on-ink); border-radius: 6px; padding: 6px 8px; font-size: 12px; text-align: left; }
.rail-foot button:hover { border-color: #5ca6ff; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 28px; border-bottom: 1px solid var(--hair); background: var(--surface); position: sticky; top: 0; z-index: 20; }
.topbar h1 { font-size: 19px; font-weight: 700; }
.topbar .sub { color: var(--muted); font-size: 12.5px; }
.topbar .spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: var(--surface-2); color: var(--fg-2); border: 1px solid var(--hair); white-space: nowrap; }
.pill.demo { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.pill.good { background: var(--good-bg); color: var(--good); border-color: transparent; }
.pill.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.pill.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.pill.brand { background: var(--glow); color: var(--brand-ink); border-color: transparent; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; }
.content { padding: 24px 28px 64px; display: grid; gap: 20px; max-width: 1480px; width: 100%; }
.view[hidden] { display: none !important; }
.view { display: grid; gap: 20px; }

/* ---------- generic blocks ---------- */
.card { background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 18px; border-bottom: 1px solid var(--hair); }
.card-h h2, .card-h h3 { font-size: 15px; font-weight: 600; }
.card-h .spacer { flex: 1; }
.card-b { padding: 16px 18px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.split { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.split.r { grid-template-columns: minmax(0, 1fr) minmax(0, 1.55fr); }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); padding: 7px 12px; border-radius: var(--r-s); font-weight: 500; font-size: 13px; }
.btn:hover { border-color: var(--brand); color: var(--brand-ink); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.btn.primary:hover { filter: brightness(1.08); color: var(--on-brand); }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: default; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.input, select.input { border: 1px solid var(--border); background: var(--surface); border-radius: var(--r-s); padding: 7px 9px; width: 100%; min-width: 0; }
.input:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 3px var(--glow); }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.lede { font-size: 13.5px; color: var(--fg-2); max-width: 78ch; margin: 0; }
.eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.note { font-size: 12px; color: var(--muted); border-left: 2px solid var(--brand); padding: 2px 0 2px 10px; margin: 0; }
.empty { padding: 24px; text-align: center; color: var(--muted); }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 2px; min-width: 0; }
.kpi .l { font-size: 12px; color: var(--muted); font-weight: 500; }
.kpi .v { font-family: var(--f-head); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.kpi .d { font-size: 11.5px; color: var(--muted); }
.kpi .d b { font-weight: 600; }

/* tables */
.tbl-wrap { overflow-x: auto; }
table.tbl { border-collapse: collapse; width: 100%; font-size: 12.5px; }
.tbl th { text-align: left; font-weight: 600; font-size: 11px; color: var(--muted); letter-spacing: .03em; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--surface); position: sticky; top: 0; }
.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--hair); vertical-align: middle; }
.tbl td.r, .tbl th.r { text-align: right; }
.tbl tbody tr:hover { background: var(--surface-2); }
.tbl tr.click { cursor: pointer; }
.tbl tr.dim td { opacity: .55; }
.tbl .unit-id { font-family: var(--f-mono); font-weight: 600; color: var(--brand-ink); }
.defs { display: grid; grid-template-columns: max-content minmax(0,1fr); gap: 6px 16px; font-size: 12.5px; margin: 0; }
.defs dt { font-weight: 600; }
.defs dd { margin: 0; color: var(--fg-2); }

/* pipeline */
.funnel { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.stage { border: 1px solid var(--hair); border-radius: 8px; padding: 12px; background: var(--surface-2); display: grid; gap: 4px; position: relative; min-width: 0; }
.stage .n { font-family: var(--f-head); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stage .t { font-size: 12px; font-weight: 600; }
.stage .c { font-size: 11px; color: var(--muted); }
.stage .bar { height: 4px; background: var(--grid); border-radius: 2px; overflow: hidden; margin-top: 4px; }
.stage .bar i { display: block; height: 100%; background: var(--brand); }
.board { display: grid; grid-template-columns: repeat(6, minmax(180px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 6px; }
.col { background: var(--surface-2); border-radius: 8px; padding: 8px; display: grid; gap: 8px; align-content: start; min-height: 120px; }
.col h4 { font-size: 12px; font-family: var(--f-body); font-weight: 600; display: flex; justify-content: space-between; padding: 2px 4px; }
.deal { background: var(--surface); border: 1px solid var(--hair); border-radius: 7px; padding: 8px 10px; font-size: 12px; display: grid; gap: 3px; cursor: pointer; text-align: left; width: 100%; }
.deal:hover { border-color: var(--brand); }
.deal b { font-weight: 600; font-size: 12.5px; }
.deal .meta { color: var(--muted); font-size: 11px; display: flex; gap: 6px; flex-wrap: wrap; }
.deal.stuck { box-shadow: inset 3px 0 0 var(--warn); }

/* bars */
.hbar { display: grid; grid-template-columns: 120px minmax(0,1fr) 54px; gap: 10px; align-items: center; font-size: 12.5px; }
.hbar + .hbar { margin-top: 8px; }
.hbar .track { height: 10px; background: var(--grid); border-radius: 3px; overflow: hidden; }
.hbar .track i { display: block; height: 100%; background: var(--brand); border-radius: 3px; }
.hbar .val { text-align: right; font-family: var(--f-mono); font-size: 12px; }

/* match */
.match-row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 14px; padding: 14px 18px; border-bottom: 1px solid var(--hair); align-items: start; }
.score-ring { width: 56px; height: 56px; }
.factors { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 14px; margin-top: 8px; }
.factor { display: grid; gap: 3px; font-size: 11.5px; }
.factor .fl { display: flex; justify-content: space-between; color: var(--muted); }
.factor .fl b { color: var(--fg); font-family: var(--f-mono); font-weight: 500; }
.factor .ft { height: 5px; background: var(--grid); border-radius: 3px; overflow: hidden; }
.factor .ft i { display: block; height: 100%; background: var(--brand); }
.factor .ft i.lo { background: var(--warn); }
.factor .ft i.zero { background: var(--bad); }
.why { font-size: 12px; color: var(--fg-2); margin-top: 6px; }
.excluded li { margin: 3px 0; }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(10,14,20,.45); z-index: 50; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); z-index: 51; box-shadow: -10px 0 40px rgba(0,0,0,.18); display: flex; flex-direction: column; }
.drawer-h { padding: 16px 20px; border-bottom: 1px solid var(--hair); display: flex; gap: 10px; align-items: start; }
.drawer-h .x { margin-left: auto; border: 0; background: transparent; font-size: 20px; line-height: 1; padding: 4px 8px; color: var(--muted); }
.drawer-b { padding: 16px 20px 40px; overflow-y: auto; display: grid; gap: 18px; }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 18px; }
.kv div { display: grid; gap: 1px; }
.kv span { font-size: 11px; color: var(--muted); }
.kv b { font-weight: 500; font-size: 13px; }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.timeline li { display: grid; grid-template-columns: 78px minmax(0,1fr); gap: 10px; font-size: 12.5px; }
.timeline .when { font-family: var(--f-mono); font-size: 11px; color: var(--muted); padding-top: 1px; }

/* WhatsApp phone */
.phone { width: 100%; max-width: 380px; margin: 0 auto; border-radius: 28px; border: 8px solid var(--ink); background: var(--wa-bg); overflow: hidden; display: flex; flex-direction: column; height: 640px; box-shadow: 0 10px 40px rgba(0,0,0,.18); }
.wa-head { background: var(--wa-head); color: #fff; padding: 10px 12px; display: flex; gap: 10px; align-items: center; }
.wa-av { width: 34px; height: 34px; border-radius: 50%; background: #0063d8; display: grid; place-items: center; font-family: var(--f-head); font-weight: 700; font-size: 14px; }
.wa-head b { display: block; font-size: 14px; font-weight: 600; }
.wa-head span { font-size: 11px; opacity: .8; }
.wa-body { flex: 1; overflow-y: auto; padding: 12px 10px; display: flex; flex-direction: column; gap: 6px; color: var(--wa-fg); }
.bub { max-width: 84%; padding: 6px 9px 4px; border-radius: 8px; font-size: 13px; line-height: 1.4; box-shadow: 0 1px .5px rgba(0,0,0,.13); white-space: pre-wrap; word-wrap: break-word; }
.bub.in { background: var(--wa-in); align-self: flex-start; border-top-left-radius: 2px; }
.bub.out { background: var(--wa-out); align-self: flex-end; border-top-right-radius: 2px; }
.bub .t { display: block; text-align: right; font-size: 10px; color: var(--wa-meta); margin-top: 2px; }
.bub.sys { align-self: center; background: var(--surface-2); color: var(--muted); font-size: 11px; box-shadow: none; text-align: center; max-width: 92%; }
.wa-card { background: var(--wa-in); border-radius: 8px; overflow: hidden; align-self: flex-start; width: 84%; box-shadow: 0 1px .5px rgba(0,0,0,.13); font-size: 12.5px; }
.wa-card .ph { height: 74px; display: grid; place-items: center; color: #fff; font-family: var(--f-mono); font-size: 11px; position: relative; }
.wa-card .ph em { position: absolute; top: 6px; right: 6px; font-style: normal; background: rgba(0,0,0,.45); padding: 1px 6px; border-radius: 4px; }
.wa-card .cb { padding: 7px 9px; display: grid; gap: 2px; }
.wa-card .cb b { font-size: 13px; }
.wa-card .cb .s { color: var(--wa-meta); font-size: 11.5px; }
.wa-card .cb .fit { color: #0b8a5f; font-weight: 600; font-size: 11.5px; }
.wa-quick { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px; background: var(--wa-bg); border-top: 1px solid rgba(0,0,0,.06); }
.wa-quick button { border: 1px solid #0b8a5f; color: #0b8a5f; background: var(--wa-in); border-radius: 16px; padding: 4px 10px; font-size: 12px; }
:root[data-theme="dark"] .wa-quick button { color: #4fd1a5; border-color: #4fd1a5; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .wa-quick button { color: #4fd1a5; border-color: #4fd1a5; } }
.wa-input { display: flex; gap: 6px; padding: 8px; background: var(--wa-bg); }
.wa-input input { flex: 1; border: 0; border-radius: 20px; padding: 9px 14px; background: var(--wa-in); color: var(--wa-fg); min-width: 0; }
.wa-input button { border: 0; border-radius: 50%; width: 38px; height: 38px; background: #0b8a5f; color: #fff; font-weight: 700; flex: none; }
.typing { align-self: flex-start; background: var(--wa-in); border-radius: 8px; padding: 8px 12px; display: flex; gap: 3px; }
.typing i { width: 6px; height: 6px; background: var(--wa-meta); border-radius: 50%; animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }

.captured { display: grid; gap: 0; }
.cap { display: grid; grid-template-columns: 130px minmax(0,1fr) 20px; gap: 8px; padding: 8px 0; border-bottom: 1px dashed var(--hair); font-size: 12.5px; align-items: center; }
.cap span { color: var(--muted); }
.cap b { font-weight: 500; }
.cap .ok { color: var(--good); font-weight: 700; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 12px; max-height: 260px; overflow-y: auto; }
.log li { display: grid; grid-template-columns: 44px minmax(0,1fr); gap: 8px; }
.log .when { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); padding-top: 2px; }
.log .hand { color: var(--warn); font-weight: 600; }

/* co-pilot chat */
.chat { display: flex; flex-direction: column; height: 620px; }
.chat-body { flex: 1; overflow-y: auto; padding: 16px 18px; display: grid; gap: 14px; align-content: start; }
.msg { display: grid; gap: 6px; max-width: 100%; min-width: 0; }
.msg.me { justify-self: end; background: var(--brand); color: var(--on-brand); padding: 8px 12px; border-radius: 12px 12px 2px 12px; max-width: 80%; }
.msg.ai { justify-self: start; background: var(--surface-2); padding: 12px 14px; border-radius: 12px 12px 12px 2px; width: 100%; }
.msg.ai p { margin: 0; }
.msg .src { font-size: 11px; color: var(--muted); border-top: 1px solid var(--hair); padding-top: 6px; margin-top: 2px; }
.msg .src b { color: var(--fg-2); font-weight: 600; }
.msg table.tbl { background: var(--surface); border-radius: 6px; }
.msg pre { margin: 0; white-space: pre-wrap; font-family: var(--f-mono); font-size: 11.5px; background: var(--surface); border: 1px solid var(--hair); border-radius: 6px; padding: 12px; line-height: 1.55; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: 12px; text-align: left; }
.chip:hover { border-color: var(--brand); color: var(--brand-ink); }
.chat-input { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--hair); }
.chat-input input { flex: 1; min-width: 0; }

/* owner report */
.report { background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r); overflow: hidden; }
.report-h { background: var(--ink); color: var(--on-ink); padding: 16px 18px; display: grid; gap: 2px; }
.report-h b { font-family: var(--f-head); font-size: 17px; }
.report-h span { font-size: 12px; color: var(--on-ink-muted); }
.report-sec { padding: 14px 18px; border-bottom: 1px solid var(--hair); display: grid; gap: 8px; }
