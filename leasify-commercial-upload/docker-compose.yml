# Run everything locally:  docker compose up --build   then open http://localhost:3000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: leasify
      POSTGRES_PASSWORD: leasify
      POSTGRES_DB: leasify
    volumes:
      - leasify-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leasify -d leasify"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://leasify:leasify@db:5432/leasify
      PORT: "3000"
      NODE_ENV: production
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  leasify-pg:
