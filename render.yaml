services:
  - type: web
    name: leasify-commercial
    runtime: docker
    plan: starter
    region: singapore
    numInstances: 1
    dockerContext: ./leasify-commercial-upload
    dockerfilePath: ./leasify-commercial-upload/Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: leasify-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Kolkata
      - key: DEMO_PIN
        value: "2580"
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: WA_TOKEN
        sync: false
      - key: WA_PHONE_NUMBER_ID
        sync: false
      - key: WA_APP_SECRET
        sync: false
      - key: WA_VERIFY_TOKEN
        generateValue: true
databases:
  - name: leasify-db
    plan: basic-256mb
    region: singapore
    databaseName: leasify
    user: leasify
